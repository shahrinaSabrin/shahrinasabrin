<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Shahrina Sabrin — Software Engineer</title>
  <desc id="desc">Minimal dark portfolio banner with warm amber accents, engineering details, and a portfolio call to action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10151c"/>
      <stop offset="100%" stop-color="#171d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6bd60"/>
      <stop offset="100%" stop-color="#f08a4b"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="80" r="170" fill="#f6bd60" opacity=".06"/>
  <circle cx="1060" cy="90" r="105" fill="none" stroke="#f6bd60" stroke-opacity=".18"/>
  <circle cx="1060" cy="90" r="72" fill="none" stroke="#f6bd60" stroke-opacity=".12"/>
  <path d="M0 365 C250 315 420 430 700 365 S1030 310 1200 355" fill="none" stroke="#f6bd60" stroke-opacity=".12" stroke-width="1.5"/>
  <rect x="74" y="66" width="8" height="8" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="100" y="76" fill="#f6bd60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="3">ENGINEERING · CURIOSITY · IMPACT</text>
  <text x="72" y="166" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">Shahrina Sabrin</text>
  <text x="76" y="218" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="400">Software Engineer</text>
  <text x="76" y="269" fill="#aab6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Building practical software for real-world problems.</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <rect x="76" y="310" width="132" height="34" rx="17" fill="#f6bd60" fill-opacity=".12" stroke="#f6bd60" stroke-opacity=".4"/>
    <text x="142" y="332" fill="#f6bd60" text-anchor="middle">FULL-STACK</text>
    <rect x="220" y="310" width="112" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="276" y="332" fill="#d7dee8" text-anchor="middle">MOBILE</text>
    <rect x="344" y="310" width="112" height="34" rx="17" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="400" y="332" fill="#d7dee8" text-anchor="middle">AI + TOOLS</text>
  </g>
  <g transform="translate(875 200)" stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M-50 -40 L-85 0 L-50 40"/>
    <path d="M50 -40 L85 0 L50 40"/>
    <path d="M18 -58 L-18 58"/>
    <circle cx="0" cy="0" r="112" stroke="#f6bd60" stroke-opacity=".12" stroke-dasharray="3 9"/>
  </g>
  <text x="76" y="397" fill="#7f8b9b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">INTELIS SOLUTION LTD.  /  DHAKA, BANGLADESH</text>
  <text x="1120" y="397" fill="#f6bd60" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" text-anchor="end">EXPLORE PORTFOLIO ↗</text>
</svg>
